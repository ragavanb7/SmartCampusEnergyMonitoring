apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-campus-energy
  labels:
    app: smart-campus-energy
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: smart-campus-energy
  template:
    metadata:
      labels:
        app: smart-campus-energy
    spec:
      containers:
        - name: energy-dashboard
          image: ragavanb7/smart-campus-energy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: smart-campus-energy-service
spec:
  type: NodePort
  selector:
    app: smart-campus-energy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080